# Data source & sampling 
data:
  sample_fraction: 0.1          # keep 10% of the corpus (set null to disable)
  sample_size: null             # absolute count (overrides fraction when set)
  sample_seed: 42               # RNG seed (reproducible sampling)

  sources:
    - type: csv
      path: data/arxiv_data.csv
      content_columns: [summaries]   # column in THIS CSV
      skip_missing: true

    # Enable these if the corresponding files exist under ./data/
    # - type: text
    #   path: data/drake_lyrics.txt
    #   skip_missing: true
    # - type: json
    #   path: data/drake_data.json
    #   jq_schema: ".[] | .lyrics"
    #   text_content: false
    #   skip_missing: true
    # - type: pdf
    #   path: data/ENGINEERING/10030015.pdf
    #   skip_missing: true

# Filesystem paths (used by notebooks + scripts)
paths:
  faiss_index:        indexes/faiss_index       # default FAISS index
  chroma_index:       indexes/chroma_arxiv      # default Chroma collection
  faiss_experiment:   indexes/faiss_experiment  # notebook 10
  chroma_experiment:  indexes/chroma_experiment # notebook 11
  reports:            reports                   # any generated reports

# Cleaning
cleaning:
  min_length: 50
  max_length: 10000
  remove_patterns:
    - "Page \\d+ of \\d+"

# Metadata enrichment 
metadata:
  enrich: true

# Splitting 
splitting:
  type: recursive
  chunk_size: 1000
  chunk_overlap: 200
  separators: ["\n\n", "\n", " ", ""]

# Embeddings 
embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5
  device: cpu
  normalize: true
  # Alternatives (used by notebook 03):
  #   openai:   { model: text-embedding-3-small }
  #   ollama:   { model: nomic-embed-text, base_url: "http://localhost:11434" }
  #   cohere:   { model: embed-english-light-v3.0 }

# Vector store
vectorstore:
  type: faiss                # faiss | chroma
  persist_dir: indexes/faiss_index
  collection_name: arxiv_abstracts
  metric: cosine             # cosine | l2 | ip (chroma only)

# Retrieval
retrieval:
  search_type: similarity    # similarity | mmr | similarity_score_threshold
  k: 3
  fetch_k: 20
  lambda_mult: 0.5
  score_threshold: 0.5
  filter: null

# LLMs
llm:
  models:
    - name: Llama-3.1-8B-Instruct
      hf_path: meta-llama/Llama-3.1-8B-Instruct
      max_new_tokens: 200
      temperature: 0.35
      top_p: 0.92
      repetition_penalty: 1.05
      load_in_4bit: true
      cpu_offload: false    # set true if you get the "modules on CPU" error

# Notebook-specific defaults (kept out of the library code) 
notebooks:
  # Standard query set used by notebooks 05, 06, 09, 10, 11
  retrieval_queries:
    - "Methods to improve adversarial robustness of graph neural networks"
    - "Recent advances in few-shot learning for image classification"
    - "Transformer-based models for long-document summarization"
    - "Self-supervised learning techniques in computer vision"
    - "Federated learning algorithms and privacy guarantees"

  # Question used by prompt-engineering experiments (notebooks 06, 13)
  sample_question: "What are GANs?"

  # Test-set construction for evaluation (notebooks 08, 09)
  evaluation:
    num_samples: 10
    question_templates:
      - "What is the main contribution of this paper?"
      - "Summarize the key findings of this research."
      - "What methods are used in this study?"
      - "What problem does this paper address?"
      - "What are the implications of this research?"

# Evaluation models
evaluation:
  perplexity_model: gpt2
  bertscore_model: bert-base-uncased
  semantic_model: sentence-transformers/all-MiniLM-L6-v2
  nli_model: roberta-large-mnli
