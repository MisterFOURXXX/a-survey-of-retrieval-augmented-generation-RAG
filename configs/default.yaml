data:
  sources:
    - type: csv
      path: data/arxiv_data.csv
      content_columns: [abstracts]

cleaning:
  min_length: 50
  max_length: 10000
  remove_patterns:
    - "Page \\d+ of \\d+"

metadata:
  enrich: true

splitting:
  type: recursive
  chunk_size: 1000
  chunk_overlap: 200
  separators: ["\n\n", "\n", " ", ""]

embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5
  device: cpu
  normalize: true

vectorstore:
  type: faiss
  persist_dir: indexes/faiss_index
  collection_name: arxiv_abstracts
  metric: cosine

retrieval:
  search_type: similarity
  k: 3

llm:
  models:
    - name: Llama-3.1-8B-Instruct
      hf_path: meta-llama/Llama-3.1-8B-Instruct
      max_new_tokens: 200
      load_in_4bit: true
